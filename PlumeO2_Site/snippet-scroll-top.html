  FICHIER 3 — BOUTON "RETOUR EN HAUT"
  
  Colle ce bloc UNE SEULE FOIS juste avant </body>
  sur CHAQUE page (index.html, ecoute.html, etc.)
  Fonctionne sur mobile ET desktop.
════════════════════════════════════════════════════════════════ -->

<!-- Bouton scroll to top -->
<button id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Retour en haut" title="Retour en haut" style="
    position: fixed;
    bottom: 28px;
    right: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0, 200, 220, 0.15);
    border: 1px solid rgba(0, 200, 220, 0.35);
    color: #00c8dc;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9000;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    pointer-events: none;
">
    <!-- Flèche SVG -->
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"/>
    </svg>
</button>

<script>
(function() {
    var btn = document.getElementById('scroll-top-btn');
    if (!btn) return;

    window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
            btn.style.opacity = '1';
            btn.style.transform = 'translateY(0)';
            btn.style.pointerEvents = 'auto';
        } else {
            btn.style.opacity = '0';
            btn.style.transform = 'translateY(12px)';
            btn.style.pointerEvents = 'none';
        }
    }, { passive: true });

    btn.addEventListener('mouseenter', function() {
        btn.style.background = 'rgba(0, 200, 220, 0.28)';
    });
    btn.addEventListener('mouseleave', function() {
        btn.style.background = 'rgba(0, 200, 220, 0.15)';
    });
})();
</script>
